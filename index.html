<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oran Bus Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #121212; }
        #map { width: 100%; height: 100vh; }
        .leaflet-control-attribution { display: none !important; }
        
        /* تطبيق الفلتر الداكن على الخريطة لحمايتها من الانهيار */
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(100%);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. استقبال الإحداثيات من الأندرويد
        const urlParams = new URLSearchParams(window.location.search);
        const myLat = parseFloat(urlParams.get('myLat')) || 35.6987;
        const myLon = parseFloat(urlParams.get('myLon')) || -0.6302;
        const stopLat = parseFloat(urlParams.get('stopLat'));
        const stopLon = parseFloat(urlParams.get('stopLon'));

        // 2. حصر الكاميرا في وهران (بدون استدعاء خوادم خارجية للقص)
        const oranBounds = L.latLngBounds([35.55, -0.80], [35.85, -0.45]);
        const map = L.map('map', { 
            zoomControl: false, 
            minZoom: 12,
            maxBounds: oranBounds,
            maxBoundsViscosity: 1.0
        }).setView([myLat, myLon], 14);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // 3. الأيقونات (بدون ظل لمنع المربع الأسود)
        const userIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            iconSize: [25, 41], iconAnchor: [12, 41]
        });
        const stopIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            iconSize: [25, 41], iconAnchor: [12, 41]
        });

        let userMarker, stopMarker, routePolyline;

        if(stopLat && stopLon) {
            stopMarker = L.marker([stopLat, stopLon], {icon: stopIcon}).addTo(map).bindPopup("المحطة");
        }

        // 4. خوارزمية التتبع الحي والرسم
        window.updateLiveLocation = function(newLat, newLon) {
            const newPos = [newLat, newLon];
            
            if(!userMarker) {
                userMarker = L.marker(newPos, {icon: userIcon}).addTo(map).bindPopup("أنت هنا");
            } else {
                userMarker.setLatLng(newPos);
            }

            if(stopLat && stopLon) {
                fetch(`https://router.project-osrm.org/route/v1/foot/${newLon},${newLat};${stopLon},${stopLat}?overview=full&geometries=geojson`)
                .then(res => res.json())
                .then(data => {
                    if(data.routes && data.routes.length > 0) {
                        const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                        if(routePolyline) map.removeLayer(routePolyline);
                        routePolyline = L.polyline(coords, {color: '#007AFF', weight: 6, opacity: 0.9}).addTo(map);
                        
                        // تعديل الكاميرا لتشمل موقعك والمحطة معاً عند الفتح الأول
                        if(!window.hasZoomed) {
                            map.fitBounds(routePolyline.getBounds(), {padding: [50, 50]});
                            window.hasZoomed = true;
                        }
                    }
                }).catch(err => console.error("OSRM Error:", err));
            }
        };

        // التشغيل الفوري
        updateLiveLocation(myLat, myLon);
    </script>
</body>
</html>
