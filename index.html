<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oran Bus Map Engine</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000000; }
        #map { width: 100%; height: 100vh; }
        .leaflet-control-attribution { display: none !important; }
        
        .dark-tiles {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(100%);
        }
        
        .leaflet-control-layers {
            border-radius: 12px !important;
            padding: 5px !important;
            font-family: Arial, sans-serif;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.9) !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const myLat = parseFloat(urlParams.get('myLat')) || 35.6987;
        const myLon = parseFloat(urlParams.get('myLon')) || -0.6302;
        const stopLat = parseFloat(urlParams.get('stopLat')) || 35.7011;
        const stopLon = parseFloat(urlParams.get('stopLon')) || -0.6127;

        const map = L.map('map', { 
            zoomControl: false,
            minZoom: 10 
        }).setView([myLat, myLon], 15);
        
        const nightLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: 'dark-tiles' });
        const dayLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });

        nightLayer.addTo(map);

        const baseMaps = {
            "الوضع الليلي 🌙": nightLayer,
            "الوضع النهاري ☀️": dayLayer,
            "القمر الصناعي 🛰️": satelliteLayer
        };
        L.control.layers(baseMaps, null, {position: 'topleft'}).addTo(map);

        fetch('https://nominatim.openstreetmap.org/search?state=Oran&country=Algeria&polygon_geojson=1&format=json')
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    const geojson = data[0].geojson;
                    let oranCoords = [];
                    
                    if (geojson.type === "Polygon") {
                        oranCoords = geojson.coordinates[0].map(c => [c[1], c[0]]);
                    } else if (geojson.type === "MultiPolygon") {
                        let maxLen = 0;
                        geojson.coordinates.forEach(poly => {
                            if(poly[0].length > maxLen) {
                                maxLen = poly[0].length;
                                oranCoords = poly[0].map(c => [c[1], c[0]]);
                            }
                        });
                    }

                    if (oranCoords.length > 0) {
                        const worldCoords = [
                            [90, -180], [90, 180], [-90, 180], [-90, -180]
                        ];
                        
                        L.polygon([worldCoords, oranCoords], {
                            color: '#FF0000',
                            weight: 2,
                            fillColor: '#000000',
                            fillOpacity: 0.85
                        }).addTo(map);

                        const oranBounds = L.latLngBounds(oranCoords);
                        map.setMaxBounds(oranBounds.pad(0.2)); 
                    }
                }
            })
            .catch(err => console.error("خطأ في جلب حدود وهران:", err));

        const userIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41]
        });
        L.marker([myLat, myLon], {icon: userIcon}).addTo(map).bindPopup("موقعك").openPopup();

        const stopIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41]
        });
        L.marker([stopLat, stopLon], {icon: stopIcon}).addTo(map).bindPopup("المحطة");

        const routeUrl = `https://router.project-osrm.org/route/v1/foot/${myLon},${myLat};${stopLon},${stopLat}?overview=full&geometries=geojson`;
        fetch(routeUrl)
            .then(response => response.json())
            .then(data => {
                if(data.routes && data.routes.length > 0) {
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    L.polyline(coords, {color: '#007AFF', weight: 6, opacity: 0.9}).addTo(map);
                }
            })
            .catch(err => console.error("خطأ في رسم المسار:", err));
    </script>
</body>
</html>
