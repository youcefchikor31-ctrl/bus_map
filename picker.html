<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pick Destination</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #121212; }
        #map { width: 100%; height: 100vh; }
        .leaflet-control-attribution { display: none !important; }
        
        /* تطبيق الفلتر الداكن على طبقة الخريطة فقط لمنع تشوه الدبابيس */
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(100%);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // تحديد حدود صارمة جداً لولاية وهران (منع الخروج للبحر أو الولايات المجاورة)
        const oranBounds = L.latLngBounds([35.55, -0.80], [35.85, -0.45]);

        // تهيئة الخريطة: تقريب مبدئي (14) يوضح الشوارع، ومنع التبعيد أقل من 12
        const map = L.map('map', { 
            zoomControl: false, 
            minZoom: 12, // يمنع رؤية إسبانيا أو الجزائر العاصمة
            maxBounds: oranBounds, // يمنع السحب خارج وهران
            maxBoundsViscosity: 1.0
        }).setView([35.6987, -0.6302], 14);
        
        // استخدام خريطة الشوارع العادية (الفلتر في CSS سيحولها لليلي)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
            maxZoom: 19 
        }).addTo(map);

        let pickedMarker = null;

        // أيقونة الدبوس (تم إزالة الظل shadowUrl لحل مشكلة المربع الأسود)
        const pinIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
            iconSize: [25, 41], 
            iconAnchor: [12, 41]
        });

        // حدث الضغط على الخريطة
        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lon = e.latlng.lng;
            
            if(pickedMarker) {
                pickedMarker.setLatLng([lat, lon]);
            } else {
                pickedMarker = L.marker([lat, lon], {icon: pinIcon}).addTo(map);
            }

            // توجيه الكاميرا للمكان المختار بنعومة
            map.flyTo([lat, lon], 16, { animate: true, duration: 0.5 });

            // إرسال الإحداثيات إلى الأندرويد
            if(window.AndroidApp) {
                window.AndroidApp.onLocationPicked(lat, lon);
            }
        });
    </script>
</body>
</html>
