<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pick Destination</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000000; }
        #map { width: 100%; height: 100vh; }
        .leaflet-control-attribution { display: none !important; }
        .dark-tiles { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(100%); }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        const map = L.map('map', { zoomControl: false, minZoom: 10 }).setView([35.6987, -0.6302], 13);
        const nightLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: 'dark-tiles' });
        nightLayer.addTo(map);

        fetch('https://nominatim.openstreetmap.org/search?state=Oran&country=Algeria&polygon_geojson=1&format=json')
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    const geojson = data[0].geojson;
                    let oranCoords = [];
                    if (geojson.type === "Polygon") oranCoords = geojson.coordinates[0].map(c => [c[1], c[0]]);
                    else if (geojson.type === "MultiPolygon") oranCoords = geojson.coordinates[0][0].map(c => [c[1], c[0]]);
                    
                    if (oranCoords.length > 0) {
                        const worldCoords = [[90, -180], [90, 180], [-90, 180], [-90, -180]];
                        L.polygon([worldCoords, oranCoords], { color: '#FF0000', weight: 2, fillColor: '#000000', fillOpacity: 0.85 }).addTo(map);
                        map.setMaxBounds(L.latLngBounds(oranCoords).pad(0.2)); 
                    }
                }
            });

        let pickedMarker = null;

        const pinIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41]
        });

        // حدث الضغط على الخريطة
        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lon = e.latlng.lng;
            
            if(pickedMarker) {
                pickedMarker.setLatLng([lat, lon]);
            } else {
                pickedMarker = L.marker([lat, lon], {icon: pinIcon}).addTo(map);
            }

            // إرسال الإحداثيات إلى الأندرويد مباشرة!
            if(window.AndroidApp) {
                window.AndroidApp.onLocationPicked(lat, lon);
            }
        });
    </script>
</body>
</html>
